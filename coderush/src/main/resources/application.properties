spring.application.name=coderush
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379
#spring.data.redis.timeout=6000

# kafka setup
spring.kafka.consumer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=myGroup
spring.kafka.consumer.auto-offset-reset=earliest

# Producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer settings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=me.rkycse.coderush.entity.RankEntity

spring.servlet.multipart.enabled=false



# ─── AI Problem Generator ────────────────────────────────────────────────────
groq.api.key=${GROQ_API_KEY:changeme}
groq.model=llama-3.1-8b-instant
groq.temperature=0.3
groq.max-tokens=4096
# Delay between LLM calls to avoid TPM rate limits on free tier (ms). Set to 0 to disable.
groq.inter-call-delay-ms=8000

agent.job.ttl=3600
agent.retry.llm=3
agent.retry.compile=3
agent.retry.sanity=2
agent.retry.input=2
agent.retry.verify=2
agent.judge.timeout.ms=30000
agent.checkpoint.timeout.ms=1800000
# Scratch question used for compile checks — create one manually or set to an existing question ID
agent.scratch.question-id=1

# Silence verbose Kafka config dumps
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN
