# mode: standalone single‐process
mode: STANDALONE

# drop privileges
user: nobody
group: nogroup

# resource limits
# max total address space (bytes)
cgroup_mem_max: 268435456       # 256 MB
rlimit_as: 268435456            # 256 MB
rlimit_cpu: 2                   # 2 s CPU time
rlimit_fsize: 5242880           # 5 MB max output file

# mount proc and dev
mount_proc: true
mount_dev: true

# minimal / (it will be a union‐fs of bindmounts)
# we will bind‐mount tempDir and the “files” folder at runtime
# no chroot: we let bindmounts define visible FS
chroot: ""

# seccomp (you can tighten this as needed)
seccomp_level: 2